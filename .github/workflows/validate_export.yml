name: Validate temporary media export

on:
  push:
    paths:
      - '.github/workflows/validate_export.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Railway deployment
        run: sleep 20
      - name: Download export archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 8 --connect-timeout 30 --max-time 600 \
            -o /tmp/export.zip \
            'https://tgautopost-production.up.railway.app/export-2195-_YE_JdWcdJKhfikv7tcW3iAO'
      - name: Validate archive
        run: |
          set -euo pipefail
          {
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Archive bytes: $(stat -c%s /tmp/export.zip)"
            echo
            unzip -l /tmp/export.zip
          } > export_validation.txt
      - name: Upload media archive
        uses: actions/upload-artifact@v4
        with:
          name: car-2195-media
          path: /tmp/export.zip
          if-no-files-found: error
          retention-days: 1
      - name: Commit validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add export_validation.txt
          git commit -m 'Validate car 2195 export archive' || exit 0
          git push
