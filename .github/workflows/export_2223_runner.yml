name: Export car 2223 on runner

on:
  push:
    paths:
      - '.github/workflows/export_2223_runner.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          echo "${GITHUB_RUN_ID}" > export_2223_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add export_2223_run.txt
          git commit -m 'Record car 2223 runner export id'
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build car 2223 archive directly
        env:
          STATE_ROOT: /tmp/tgautopost_state
          MEDIA_ROOT: /tmp/tgautopost_media
        run: |
          python - <<'PY'
          import asyncio
          import shutil
          from pathlib import Path
          from batch_export import build_one

          path = asyncio.run(build_one('2223'))
          destination = Path('/tmp/car_2223_photos_videos.zip')
          shutil.copy2(path, destination)
          print(destination, destination.stat().st_size)
          PY
      - name: Upload car 2223
        uses: actions/upload-artifact@v4
        with:
          name: car-2223-media
          path: /tmp/car_2223_photos_videos.zip
          if-no-files-found: error
          retention-days: 1
